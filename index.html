<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Online SMPN 4 Semin</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

.soal{
    margin-bottom:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

#hasil{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<h1>Ujian Online SMPN 4 Semin</h1>

<p>
Nama:<br>
<input type="text" id="nama" required>
</p>

<p>
Kelas:<br>
<input type="text" id="kelas" required>
</p>

<div class="soal">
<p>1. ASEAN didirikan pada tahun ...</p>
<label><input type="radio" name="q1" value="A"> 1965</label><br>
<label><input type="radio" name="q1" value="B"> 1967</label><br>
<label><input type="radio" name="q1" value="C"> 1970</label><br>
<label><input type="radio" name="q1" value="D"> 1972</label>
</div>

<div class="soal">
<p>2. Ibu kota Indonesia adalah ...</p>
<label><input type="radio" name="q2" value="A"> Surabaya</label><br>
<label><input type="radio" name="q2" value="B"> Bandung</label><br>
<label><input type="radio" name="q2" value="C"> Jakarta</label><br>
<label><input type="radio" name="q2" value="D"> Semarang</label>
</div>

<div class="soal">
<p>3. Lambang sila ke-5 adalah ...</p>
<label><input type="radio" name="q3" value="A"> Bintang</label><br>
<label><input type="radio" name="q3" value="B"> Pohon Beringin</label><br>
<label><input type="radio" name="q3" value="C"> Kepala Banteng</label><br>
<label><input type="radio" name="q3" value="D"> Padi dan Kapas</label>
</div>

<div class="soal">
<p>4. Gunung tertinggi di Indonesia adalah ...</p>
<label><input type="radio" name="q4" value="A"> Merapi</label><br>
<label><input type="radio" name="q4" value="B"> Kerinci</label><br>
<label><input type="radio" name="q4" value="C"> Puncak Jaya</label><br>
<label><input type="radio" name="q4" value="D"> Semeru</label>
</div>

<div class="soal">
<p>5. Proklamasi Kemerdekaan Indonesia dibacakan pada ...</p>
<label><input type="radio" name="q5" value="A"> 17 Agustus 1945</label><br>
<label><input type="radio" name="q5" value="B"> 18 Agustus 1945</label><br>
<label><input type="radio" name="q5" value="C"> 20 Mei 1908</label><br>
<label><input type="radio" name="q5" value="D"> 28 Oktober 1928</label>
</div>

<button onclick="kirim()">Kirim Jawaban</button>

<div id="hasil"></div>

<script>

const kunci = {
 q1:"B",
 q2:"C",
 q3:"D",
 q4:"C",
 q5:"A"
};

// GANTI DENGAN URL APPS SCRIPT MILIK GUSS
const scriptURL = "https://script.google.com/macros/s/AKfycbzzxNvLxqPpR0ETyyxYNfppsOJ1hjjqaLpUhk0YRCoQ6k55HcnNdVkYQjSnO2eWeK-Yjw/exec";

function kirim(){

 let nama = document.getElementById("nama").value.trim();
 let kelas = document.getElementById("kelas").value.trim();

 // Validasi nama
 if(nama === ""){
   alert("Nama harus diisi!");
   return;
 }

 // Validasi kelas
 if(kelas === ""){
   alert("Kelas harus diisi!");
   return;
 }

 // Cegah kirim dua kali
 const tombol = document.getElementById("btnKirim");

 if(tombol.disabled){
   return;
 }

 let benar = 0;

 for(let i=1;i<=5;i++){
   const jawaban = document.querySelector(`input[name=q${i}]:checked`);

   if(jawaban && jawaban.value === kunci[`q${i}`]){
      benar++;
   }
 }

 let salah = 5 - benar;
 let nilai = benar * 20;

 document.getElementById("hasil").innerHTML =
   "Nilai Anda : " + nilai;

 const data = {
   nama:nama,
   kelas:kelas,
   benar:benar,
   salah:salah,
   nilai:nilai
 };

 // Nonaktifkan tombol
 tombol.disabled = true;
 tombol.innerHTML = "Ujian Selesai";

 fetch(scriptURL,{
   method:"POST",
   body:JSON.stringify(data)
 });

}

 let benar = 0;

 for(let i=1;i<=5;i++){
   const jawaban = document.querySelector(`input[name=q${i}]:checked`);
   if(jawaban && jawaban.value === kunci[`q${i}`]){
      benar++;
   }
 }

 let salah = 5 - benar;
 let nilai = benar * 20;

 document.getElementById("hasil").innerHTML =
   "Nilai Anda : " + nilai;

 const data = {
   nama: document.getElementById("nama").value,
   kelas: document.getElementById("kelas").value,
   benar: benar,
   salah: salah,
   nilai: nilai
 };

 fetch(scriptURL,{
   method:"POST",
   body:JSON.stringify(data)
 });

}
</script>

</body>
</html>
