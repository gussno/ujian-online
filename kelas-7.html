<button id="btnKirim" onclick="kirim()">Kirim Jawaban</button>

<script>

  q2:"C",
  q3:"D",
  q4:"C",
  q5:"A"

// GANTI DENGAN URL APPS SCRIPT MILIK GUSS
const scriptURL = "https://script.google.com/macros/s/AKfycbzzxNvLxqPpR0ETyyxYNfppsOJ1hjjqaLpUhk0YRCoQ6k55HcnNdVkYQjSnO2eWeK-Yjw/exec";

const dataSiswa = {

"7B":[

]

};

function updateNama(){

  const kelas = document.getElementById("kelas").value;
  const namaSelect = document.getElementById("nama");

  namaSelect.innerHTML =
    '<option value="">-- Pilih Nama --</option>';

  if(!kelas) return;

  dataSiswa[kelas].forEach(nama => {

    const option = document.createElement("option");

    option.value = nama;
    option.textContent = nama;

    namaSelect.appendChild(option);

  });

}

function kirim(){

  const nama = document.getElementById("nama").value.trim();
  const kelas = document.getElementById("kelas").value.trim();

  if(nama === ""){
    alert("Nama harus diisi!");
    return;
  }

  if(kelas === ""){
    alert("Kelas harus diisi!");
    return;
  }

  const tombol = document.getElementById("btnKirim");

  if(tombol.disabled){
    return;
  }

  let benar = 0;

  for(let i=1;i<=5;i++){
    const jawaban = document.querySelector(`input[name=q${i}]:checked`);

    if(jawaban && jawaban.value === kunci[`q${i}`]){
      benar++;
    }
  }

  const salah = 5 - benar;
  const nilai = benar * 20;

  document.getElementById("hasil").innerHTML =
    "Nilai Anda : " + nilai;

  const data = {
    nama:nama,
    kelas:kelas,
    benar:benar,
    salah:salah,
    nilai:nilai
  };

  tombol.disabled = true;
  tombol.innerHTML = "Ujian Selesai";

  fetch(scriptURL,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(() => {
    console.log("Data berhasil dikirim");
  })
  .catch(error => {
    console.error(error);
    alert("Gagal mengirim data");
  });

}

</script>
